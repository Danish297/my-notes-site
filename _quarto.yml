# Quarto project configuration: save as _quarto.yml in the project root.
project:
  type: website
  output-dir: _site

website:
  title: "D@n!$h297"
  description: "Personal notes on AI, computer vision, software, and learning in public."
  favicon: assets/favicon.svg
  site-url: https://danish297.github.io/my-notes-site/

  # Preserve Quarto-managed search, navigation, and responsive collapse.
  navbar:
    background: dark
    search: true
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: notes/11g_Unknown_facts.qmd
        text: Notes
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/danish297/
        aria-label: "GitHub profile (opens in a new tab)"
        target: _blank
        rel: "noopener noreferrer"

      - icon: linkedin
        href: https://www.linkedin.com/in/hasnain-danish-shaikh/
        aria-label: "LinkedIn profile (opens in a new tab)"
        target: _blank
        rel: "noopener noreferrer"

  sidebar:
    style: floating
    background: "#0a0f1a"
    foreground: "#ccd6f6"
    contents:
      - section: "Notes"
        contents:
          - notes/11g_Unknown_facts.qmd
          - notes/12c_new_features.qmd
          - notes/19c_vs_23ai.qmd
          - notes/NewOracleDB.qmd

  page-footer:
    left: "© 2026 Danish297"
    right:
      - icon: github
        href: https://github.com/danish297


# Local stylesheet overrides both built-in themes; no new runtime libraries.
format:
  html:
    theme:
      dark: darkly
      light: flatly
#    respect-user-color-scheme: true
    css: styles.css
    # Add the floating feedback link to every rendered HTML page.
    include-after-body:
      - _includes/floating-feedback.html 
    toc: false
    code-copy: true
    link-external-icon: true
